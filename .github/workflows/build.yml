name: Build Mod Jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25 (Minecraft Toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Java 21 (Gradle Runner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
      - name: Build with Gradle
        run: gradle build
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: donutmap-mod-jar
          path: build/libs/*.jar
